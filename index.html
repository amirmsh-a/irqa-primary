648\u0627\u0628\u062A\u0643\u0627\u0631 \u062A\u0642\u0646\u064A\u0627\u062A \u062C\u062F\u064A\u062F\u0629."],[2,"\u0648","\u0627\u0644\u062A\u0639\u0644\u0645 \u0627\u0644\u0645\u062A\u0645\u0627\u064A\u0632",1,"\u064A\u0633\u062A\u062E\u062F\u0645 \u0627\u0633\u062A\u0631\u0627\u062A\u064A\u062C\u064A\u0627\u062A \u0645\u062E\u062A\u0644\u0641\u0629 \u0644\u062A\u0637\u0628\u064A\u0642 \u0627\u0644\u062A\u0645\u0627\u064A\u0632 \u0641\u064A \u0627\u0644\u062A\u0639\u0644\u0645 (\u062D\u0633\u0628 \u0645\u062E\u0631\u062C\u0627\u062A \u062A\u0639\u0644\u0645 \u0643\u0644 \u0637\u0627\u0644\u0628 \u0648\u0627\u0644\u062F\u0639\u0645 \u0627\u0644\u0645\u0642\u062F\u0645 \u0644\u0647) \u0644\u0636\u0645\u0627\u0646 \u0645\u0634\u0627\u0631\u0643\u0629 \u062C\u0645\u064A\u0639 \u0627\u0644\u0645\u062A\u0639\u0644\u0645\u064A\u0646 \u0641\u064A \u0627\u0644\u062A\u0639\u0644\u0645 \u0648\u0641\u0642\u0627\u064B \u0644\u0627\u062D\u062A\u064A\u0627\u062C\u0627\u062A\u0647\u0645."],[2,"\u0632","\u0631\u0628\u0637 \u0627\u0644\u0645\u0648\u0636\u0648\u0639 \u0628\u0627\u0644\u062D\u064A\u0627\u0629 \u0648\u0628\u0627\u0644\u0645\u0648\u0627\u062F \u0627\u0644\u0623\u062E\u0631\u0649",.5,"\u0627\u0644\u062A\u0631\u0643\u064A\u0632 \u0639\u0644\u0649 \u0631\u0628\u0637 \u0627\u0644\u0645\u062D\u062A\u0648\u0649 \u0628\u0627\u0644\u062D\u064A\u0627\u0629 \u0627\u0644\u0648\u0627\u0642\u0639\u064A\u0629 \u0648\u0628\u0627\u0644\u0645\u0648\u0627\u062F \u0627\u0644\u0623\u062E\u0631\u0649."],[2,"\u062D","\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0627\u0644\u062A\u0643\u0646\u0648\u0644\u0648\u062C\u064A\u0627 \u0648\u0627\u0644\u0645\u0648\u0627\u0631\u062F \u0627\u0644\u0623\u062E\u0631\u0649",1,"\u062F\u0639\u0645 \u0639\u0645\u0644\u064A\u062A\u064A \u0627\u0644\u062A\u0639\u0644\u064A\u0645 \u0648\u0627\u0644\u062A\u0639\u0644\u0645 \u0628\u062A\u0648\u0638\u064A\u0641 \u0627\u0644\u062A\u0643\u0646\u0648\u0644\u0648\u062C\u064A\u0627 \u0648\u0627\u0644\u0645\u0648\u0627\u0631\u062F \u0627\u0644\u0645\u0646\u0627\u0633\u0628\u0629."],[2,"\u0637","\u0627\u0644\u0628\u064A\u0626\u0629 \u0627\u0644\u0635\u0641\u064A\u0629 \u0627\u0644\u062F\u0627\u0639\u0645\u0629 \u0648\u0627\u0644\u0645\u0633\u0627\u0639\u062F\u0629 \u0644\u062A\u0646\u0645\u064A\u0629 \u0645\u0647\u0627\u0631\u0627\u062A \u0627\u0644\u0642\u0631\u0646 \u0627\u0644\u062D\u0627\u062F\u064A \u0648\u0627\u0644\u0639\u0634\u0631\u064A\u0646",1,"\u062E\u0644\u0642 \u0628\u064A\u0626\u0629 \u062A\u0639\u0644\u064A\u0645\u064A\u0629 \u0645\u062D\u0641\u0632\u0629 \u0648\u0645\u0641\u0636\u064A\u0629 \u0644\u0623\u0646\u0634\u0637\u0629 \u062A\u0631\u0643\u0632 \u0639\u0644\u0649 \u0627\u0644\u0637\u0627\u0644\u0628 \u0648\u062A\u0645\u0646\u062D\u0647 \u0641\u0631\u0635\u0627\u064B \u0644\u0644\u0627\u062E\u062A\u064A\u0627\u0631 \u0648\u0627\u0644\u062A\u0639\u0627\u0648\u0646 \u0648\u0627\u0644\u0627\u0628\u062A\u0643\u0627\u0631 \u0648\u0627\u0644\u062A\u0639\u0628\u064A\u0631 \u0639\u0646 \u0627\u0644\u0622\u0631\u0627\u0621 \u0648\u0645\u0634\u0627\u0631\u0643\u062A\u0647\u0627 \u0645\u0639 \u0627\u0644\u0622\u062E\u0631\u064A\u0646."],[2,"\u064A","\u0627\u0644\u0645\u0647\u0627\u0645 \u0627\u0644\u0635\u0639\u0628\u0629 \u0630\u0627\u062A \u0627\u0644\u062A\u062D\u062F\u064A",1,"\u064A\u062F\u0645\u062C \u0627\u0644\u0645\u0647\u0627\u0645 \u0627\u0644\u0635\u0639\u0628\u0629 \u0627\u0644\u062A\u064A \u062A\u062A\u0637\u0644\u0628 \u062A\u0641\u0643\u064A\u0631\u0627\u064B \u0639\u0627\u0644\u064A \u0627\u0644\u0645\u0633\u062A\u0648\u0649 \u0623\u0648 \u0645\u0647\u0627\u0631\u0627\u062A \u0639\u0645\u0644\u064A\u0629 \u062A\u0646\u0645\u064A \u0639\u0642\u0644\u064A\u0629 \u0627\u0644\u0637\u0627\u0644\u0628 \u0648\u0643\u0641\u0627\u0621\u062A\u0647 \u0627\u0644\u0630\u0627\u062A\u064A\u0629."],[3,"\u0623","\u0627\u0644\u062A\u0642\u0648\u064A\u0645 \u0627\u0644\u062A\u0643\u0648\u064A\u0646\u064A",2,"\u0627\u0644\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0627\u0644\u0641\u0639\u0627\u0644 \u0644\u0623\u062F\u0648\u0627\u062A \u0627\u0644\u062A\u0642\u0648\u064A\u0645 \u0627\u0644\u062A\u0643\u0648\u064A\u0646\u064A \u0627\u0644\u0645\u0646\u0627\u0633\u0628\u0629 (\u0644\u0636\u0628\u0637 \u0627\u0644\u062A\u0639\u0644\u064A\u0645). \u0627\u0644\u062A\u0623\u0643\u062F \u0645\u0646 \u0623\u0646 \u062C\u0645\u064A\u0639 \u0627\u0644\u0645\u062A\u0639\u0644\u0645\u064A\u0646 \u064A\u0646\u062A\u062C\u0648\u0646 \u0623\u062F\u0644\u0629 \u0639\u0644\u0649 \u0627\u0644\u062A\u0639\u0644\u0645."],[3,"\u0628","\u0627\u0644\u0623\u0645\u062B\u0644\u0629 / \u0627\u0644\u0642\u0648\u0627\u0639\u062F \u0648\u0627\u0644\u0639\u0646\u0627\u0648\u064A\u0646",.5,"\u0627\u0644\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0627\u0644\u0641\u0639\u0627\u0644 \u0644\u0644\u0646\u0645\u0627\u0630\u062C / \u0627\u0644\u0642\u0648\u0627\u0639\u062F."],[3,"\u062C","\u0627\u0644\u0645\u0631\u0627\u062C\u0639\u0627\u062A \u0627\u0644\u0628\u0646\u0627\u0621\u0629",1,"\u062A\u0648\u0641\u064A\u0631 \u0645\u0644\u0627\u062D\u0638\u0627\u062A \u0628\u0646\u0627\u0621\u0629 \u0648\u0645\u0634\u062C\u0639\u0629 (\u0645\u0643\u062A\u0648\u0628\u0629 \u0623\u0648 \u0634\u0641\u0647\u064A\u0629 \u0623\u0648 \u0628\u0648\u0633\u0627\u0626\u0644 \u0623\u062E\u0631\u0649)."],[3,"\u062F","\u0627\u0644\u0627\u0647\u062A\u0645\u0627\u0645 \u0628\u0627\u0644\u0645\u062A\u0639\u0644\u0645",1.5,"\u0627\u0644\u0627\u0647\u062A\u0645\u0627\u0645 \u0628\u0627\u0644\u0637\u0644\u0627\u0628 \u0648\u0627\u0644\u062A\u0631\u062D\u064A\u0628 \u0628\u0627\u0633\u062A\u0641\u0633\u0627\u0631\u0627\u062A\u0647\u0645 \u0648\u0645\u0634\u0627\u0631\u0643\u0627\u062A\u0647\u0645\u060C \u062F\u0648\u0646 \u062E\u0648\u0641 \u0645\u0646 \u0631\u062F\u0648\u062F \u0627\u0644\u0641\u0639\u0644 \u0627\u0644\u0633\u0644\u0628\u064A\u0629\u060C \u0648\u0625\u0638\u0647\u0627\u0631 \u0627\u0644\u062A\u0639\u0627\u0637\u0641 \u062A\u062C\u0627\u0647 \u062C\u0645\u064A\u0639 \u0627\u064
